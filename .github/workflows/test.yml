name: Branch tests

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: branch-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.platform }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            #runner: '{"group":"NewCode-group","labels":"arc-franchet-ovh"}'
            # in house runner is too slow. Need more CPUs
            runner: '"ubuntu-24.04"'
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: '"ubuntu-24.04-arm"'
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Install job prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 sudo file gh xz-utils unzip
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure workspace Git
        uses: ./.github/actions/git-workspace
      - name: Run shared Linux checks
        uses: ./.github/actions/linux-checks
        with:
          target: ${{ matrix.target }}
          build-release: ${{ github.ref == 'refs/heads/main' }}
