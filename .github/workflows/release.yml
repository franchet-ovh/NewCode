name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  prepare:
    name: Commit release versions to main
    if: github.event_name == 'release' && github.event.action == 'published' && !startsWith(github.event.release.tag_name, 'addon_')
    runs-on:
      group: NewCode-group
      labels: arc-franchet-ovh
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    environment: release-version
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Install job prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 sudo file gh xz-utils unzip
      - name: Create release App token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          # Only this job receives the environment-scoped PR-bypass identity.
          token: ${{ steps.release-token.outputs.token }}
          persist-credentials: true
      - name: Configure workspace Git
        uses: ./.github/actions/git-workspace
      - name: Configure release commit identity
        run: |
          git -C "$GITHUB_WORKSPACE" config --local user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit and push release versions
        id: version
        run: python3 scripts/release/commit_version.py "$RELEASE_TAG"

  build:
    needs: prepare
    name: Build ${{ matrix.platform }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            #runner: '{"group":"NewCode-group","labels":"arc-franchet-ovh"}'
            # in house runner is too slow. Need more CPUs
            runner: '"ubuntu-24.04"'
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: '"ubuntu-24.04-arm"'
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Install job prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 sudo file gh xz-utils unzip
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Configure workspace Git
        uses: ./.github/actions/git-workspace
      - name: Validate committed release versions
        run: python3 scripts/release/prepare_version.py --check "$RELEASE_TAG"
      - name: Run shared Linux checks
        uses: ./.github/actions/linux-checks
        with:
          target: ${{ matrix.target }}
          build-release: 'true'
      - name: Package and verify
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release/package.py "$TARGET" "$RELEASE_TAG"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    name: Attach verified downloads
    needs: [prepare, build]
    runs-on:
      group: NewCode-group
      labels: arc-franchet-ovh
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Install job prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 sudo file gh xz-utils unzip
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Configure workspace Git
        uses: ./.github/actions/git-workspace
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate committed release versions
        run: python3 scripts/release/prepare_version.py --check "$RELEASE_TAG"
      - name: Validate downloads and generate checksums
        run: |
          python3 scripts/release/checksums.py dist "$RELEASE_TAG"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Upload to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
      - name: Remove draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false
