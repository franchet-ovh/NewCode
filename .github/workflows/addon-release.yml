name: Independent addon release
on:
  workflow_call:
    inputs:
      addon:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      version:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      addon:
        description: Addon ID
        type: choice
        options: [github, codex, opencode]
        required: true
      version:
        description: Optional explicit x.y.z; otherwise increment patch
        type: string
permissions:
  contents: read
concurrency:
  group: addon-release-${{ inputs.addon }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.reserve.outputs.tag }}
      done: ${{ steps.reserve.outputs.done }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ADDON: ${{ inputs.addon }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/release/publish_addon.py reserve --addon "$ADDON" --source-sha "$SOURCE_SHA" --version "$VERSION"
  build:
    needs: prepare
    if: needs.prepare.outputs.done != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Stamp selected addon
        env:
          ADDON: ${{ inputs.addon }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/release/publish_addon.py stamp --addon "$ADDON" --tag "$TAG"
      - uses: ./.github/actions/linux-checks
        with:
          component: ${{ inputs.addon }}
          target: ${{ matrix.target }}
          build-release: 'true'
      - name: Package selected addon
        env:
          ADDON: ${{ inputs.addon }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release/publish_addon.py package --addon "$ADDON" --tag "$TAG" --target "$TARGET"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: addon-${{ inputs.addon }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: addon-${{ inputs.addon }}-*
          path: dist
          merge-multiple: true
      - name: Verify and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ADDON: ${{ inputs.addon }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/release/publish_addon.py publish --addon "$ADDON" --tag "$TAG"
