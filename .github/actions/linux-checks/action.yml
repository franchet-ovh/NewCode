name: Linux release checks
description: Shared Linux dependencies, toolchains, formatting, and tests
inputs:
  target:
    description: Native Rust target triple
    required: true
  component:
    description: editor, addon-sdk, addon-support, or addon ID
    default: editor
  build-release:
    description: Build optimized binaries and populate the shared release cache
    default: 'false'
runs:
  using: composite
  steps:
    - name: Select project
      id: project
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
      run: |
        project=.
        cache_target=target
        if [ "$COMPONENT" != editor ]; then
          if [ -f "crates/$COMPONENT/Cargo.toml" ]; then project="crates/$COMPONENT"; else project="addons/$COMPONENT"; fi
          cache_target=../../target
        fi
        echo "path=$project" >> "$GITHUB_OUTPUT"
        echo "cache-target=$cache_target" >> "$GITHUB_OUTPUT"
    - name: Install Linux build and test dependencies
      if: inputs.component == 'editor'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates build-essential pkg-config libx11-dev libxkbcommon-dev \
          libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
          libxcursor-dev libxi-dev libxrandr-dev zsh fonts-dejavu-core
    - name: Install stable Rust
      env:
        TARGET: ${{ inputs.target }}
      shell: bash
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup toolchain install stable --profile minimal --component rustfmt
        rustup default stable
        host=$(rustc -vV | sed -n 's/^host: //p')
        if [ "$host" != "${TARGET/-musl/-gnu}" ]; then
          echo "Native tests require $TARGET, but this runner provides $host" >&2
          exit 1
        fi
        rustup target add "$TARGET"
        if [[ "$TARGET" == *-musl ]]; then
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
        fi
    - name: Install pinned Zig toolchain for Ghostty
      if: inputs.component == 'editor'
      shell: bash
      run: |
        python3 scripts/install-zig.py "$RUNNER_TEMP/focus-zig"
        echo "$RUNNER_TEMP/focus-zig" >> "$GITHUB_PATH"
    - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      with:
        # Isolate project/profile caches so independent immutable cache writes
        # do not starve other projects of their compiled artifacts.
        shared-key: linux-${{ inputs.target }}-${{ inputs.component }}-${{ inputs.build-release == 'true' && 'release' || 'debug' }}
        workspaces: ${{ steps.project.outputs.path }} -> ${{ steps.project.outputs.cache-target }}
    - name: Check selected project
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        TARGET: ${{ inputs.target }}
        BUILD_RELEASE: ${{ inputs.build-release }}
      run: |
        trap 'echo "${COMPONENT} (${TARGET}): ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"' EXIT
        project="${{ steps.project.outputs.path }}"
        cargo fmt --check --manifest-path "$project/Cargo.toml"
        cargo test --manifest-path "$project/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/target" --target "$TARGET"
        if [ "$BUILD_RELEASE" = true ]; then
          if [ "$COMPONENT" = editor ]; then
            cargo build --release --bins --target "$TARGET"
          else
            python3 scripts/addons.py --release --target "$TARGET" --addon "$COMPONENT"
          fi
        fi
