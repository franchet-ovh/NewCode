name: Linux release checks
description: Shared Linux dependencies, toolchains, formatting, and tests
inputs:
  target:
    description: Native Rust target triple
    required: true
  build-release:
    description: Build optimized binaries and populate the shared release cache
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install Linux build and test dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates build-essential pkg-config libx11-dev libxkbcommon-dev \
          libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
          libxcursor-dev libxi-dev libxrandr-dev zsh fonts-dejavu-core
    - name: Install stable Rust
      env:
        TARGET: ${{ inputs.target }}
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt
        rustup default stable
        rustup target add "$TARGET"
    - name: Install pinned Zig toolchain for Ghostty
      shell: bash
      run: |
        python3 scripts/install-zig.py "$RUNNER_TEMP/focus-zig"
        echo "$RUNNER_TEMP/focus-zig" >> "$GITHUB_PATH"
    - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      with:
        # Main-branch builds seed optimized dependencies for release-tag jobs.
        # Keep debug-only jobs separate so an immutable debug cache cannot
        # prevent the optimized artifacts from being saved.
        shared-key: linux-${{ inputs.target }}-${{ inputs.build-release == 'true' && 'release' || 'debug' }}
        workspaces: |
          . -> target
          crates/addon-sdk -> ../../target
          crates/addon-support -> ../../target
          addons/codex -> ../../target
          addons/opencode -> ../../target
          addons/github -> ../../target
    - name: Check Rust formatting
      shell: bash
      run: cargo fmt --check
    - name: Test release packaging scripts
      shell: bash
      run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
    - name: Run Rust tests
      env:
        TARGET: ${{ inputs.target }}
      shell: bash
      run: cargo test --locked --target "$TARGET"
    - name: Test SDK and addon projects
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: python3 scripts/addons.py --test --target "$TARGET"
    - name: Build optimized executables
      if: inputs.build-release == 'true'
      env:
        TARGET: ${{ inputs.target }}
      shell: bash
      run: |
        cargo build --release --bins --locked --target "$TARGET"
        python3 scripts/addons.py --release --target "$TARGET"
