const paths={folder:'<path d="M3 7V5h6l2 2h10v13H3z"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',git:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M6 7v10m0-3c0-5 12-1 12-7"/>',github:'<path d="M9 19c-4 1-4-2-6-2m12 5v-3.8a3.3 3.3 0 0 0-.9-2.6c3-.3 6.2-1.5 6.2-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6S17.7 1.4 15 3a13 13 0 0 0-7 0C5.3 1.4 4.2 1.7 4.2 1.7a4.8 4.8 0 0 0-.1 3.6A5.2 5.2 0 0 0 2.7 9c0 5.2 3.2 6.3 6.2 6.7A3.3 3.3 0 0 0 8 18v4"/>',addons:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',spark:'<path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>',check:'<path d="m5 12 4 4L19 6"/>',refresh:'<path d="M20 10a8 8 0 1 0-2 8M20 3v7h-7"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',back:'<path d="M19 12H5m5-5-5 5 5 5"/>',external:'<path d="M14 3h7v7m0-7L10 14m1-10H4v16h16v-7"/>',issue:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1"/>',pull:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v10m12 0V9c0-3-4-4-6-4m3-3-3 3 3 3"/>',file:'<path d="M5 3h9l5 5v13H5zM14 3v6h5"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.2"/>',terminal:'<path d="m4 6 6 6-6 6m9 0h7"/>',save:'<path d="M4 3h14l3 3v15H3V3zM7 3v6h10V3M7 21v-8h10v8"/>',palette:'<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/>',chevron:'<path d="m9 5 7 7-7 7"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.file}</svg>`;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,kind='',symbol='',extra='')=>`<button class="btn ${kind}" data-action="${action}" ${extra}>${symbol?icon(symbol):''}${label}</button>`;
const badge=(text,kind='')=>`<span class="badge ${kind}">${text}</span>`;
const notice=(text,kind='')=>`<div class="notice ${kind}">${icon(kind==='success'?'check':'info')}<span>${text}</span></div>`;
const field=(label,id,value='',placeholder='',extra='')=>`<label class="field"><span>${label}</span><input id="${id}" value="${esc(value)}" placeholder="${placeholder}" ${extra}></label>`;
const modules=[['explorer','Explorer','folder'],['search','Search','search'],['git','Source control','git'],['github','GitHub','github'],['addons','Addons','addons'],['assistant','Assistant','spark'],['components','Component library','palette']];
const issues=[{n:75,title:'UI upgrade',tag:'enhancement',age:'2 hours ago'},{n:72,title:'Restore the workspace after restart',tag:'editor',age:'1 day ago'},{n:69,title:'Improve search in large repositories',tag:'enhancement',age:'2 days ago'},{n:66,title:'Keep terminal colors in sync with theme',tag:'bug',age:'3 days ago'}];
const pulls=[{n:74,title:'Shared theme tokens for addon surfaces',tag:'Ready for review',age:'4 hours ago'},{n:71,title:'Preserve cursor when switching tabs',tag:'Draft',age:'1 day ago'}];
const addons=[{id:'github',name:'GitHub',mark:'GH',desc:'Issues, pull requests, and branches. Without leaving your workspace.',version:'0.4.8',installed:true,enabled:true},{id:'codex',name:'Codex',mark:'✧',desc:'Plan, write, and review code with an assistant in your editor.',version:'0.4.8',installed:true,enabled:true},{id:'opencode',name:'OpenCode',mark:'oc',desc:'Connect your preferred models to a workspace-aware coding assistant.',version:'0.4.8',installed:true,enabled:false},{id:'lsp-rust',name:'Rust language support',mark:'Rs',desc:'Completions, diagnostics, and navigation for Rust projects.',version:'0.4.8',installed:true,enabled:true},{id:'lsp-python',name:'Python language support',mark:'Py',desc:'Language intelligence for Python, powered by Pyright.',version:'0.4.8',installed:false,enabled:false}];
const files={'view.rs':`use focus_addon_sdk::{View, Widget};\n\nimpl App {\n    pub fn view(&self) -> View {\n        View {\n            title: "GitHub".into(),\n            sidebar: self.repository_panel(),\n            detail: self.selected_item(),\n            ..View::default()\n        }\n    }\n\n    fn repository_panel(&self) -> Vec<Widget> {\n        // One set of controls. Every panel.\n        vec![\n            Widget::button("refresh", "Refresh"),\n            Widget::input("query", "Filter issues", ""),\n        ]\n    }\n}\n`, 'ui_theme.rs':`// Semantic appearance shared by editor and addons.\n\npub struct Theme {\n    pub colors: Colors,\n    pub metrics: Metrics,\n}\n\npub struct Metrics {\n    pub control_height: f32,\n    pub panel_header_height: f32,\n    pub spacing: f32,\n}\n\n// Proposed design: clear labels, comfortable controls.\n`, 'README.md':'# Focus Editor\n\nA little more room to focus.\n\nThis is editable sample content in the UI preview.\nNo files are read or written.\n'};
const state={module:'github',githubTab:'issues',item:75,query:'',repo:'franchet-ovh/NewCode',branch:'main',githubPage:'item',addonTab:'installed',addon:'github',addonQuery:'',file:'view.rs',dirty:new Set(),terminal:false,bottomTab:'terminal',assistant:'Codex',messages:[],draft:'',form:{},folders:{src:true,addons:true},gitFiles:new Set(),search:'',sampleTab:'first'};
const $=s=>document.querySelector(s);
let toastTimer,refreshTimer,refreshBusy=false;
function toast(text){$('#toast').innerHTML=icon('check')+`<span>${esc(text)}</span>`;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function nav(module){state.module=module;$('#workspace').classList.remove('sidebar-open');render()}
function render(){
 $('#activity').innerHTML=modules.map(([id,label,symbol])=>`<button class="nav ${id==='components'?'bottom':''}" data-action="navigate" data-module="${id}" aria-label="${label}" title="${label}" aria-pressed="${state.module===id}">${icon(symbol)}</button>`).join('');
 $('#branch-status').innerHTML=icon('git')+esc(state.branch);
 renderSidebar();renderMain();
}
function sideShell(title,content,footer,action=''){return `<div class="panel-head"><h2>${title}</h2>${action}</div><div class="side-content">${content}</div><div class="sidebar-footer">${icon('info')}${footer}</div>`}
function renderSidebar(){let content='';
 if(state.module==='github'){
 content=`<label class="field"><span>Repository</span><select id="repository"><option ${state.repo==='franchet-ovh/NewCode'?'selected':''}>franchet-ovh/NewCode</option><option ${state.repo==='demo/design-system'?'selected':''}>demo/design-system</option></select></label><div class="meta-line">${icon('git')}<span class="mono">${esc(state.branch)}</span>${badge('Connected','success')}</div><hr class="rule"><div class="segmented" aria-label="GitHub item type">${['issues','pulls'].map(t=>`<button data-action="github-tab" data-tab="${t}" aria-pressed="${state.githubTab===t}">${t==='issues'?'Issues':'Pull requests'} <small>${t==='issues'?4:2}</small></button>`).join('')}</div><div style="height:14px"></div><label class="field"><span class="eyebrow" style="margin:0">Filter loaded items</span><input type="search" id="issue-filter" placeholder="Search by title or number…" value="${esc(state.query)}"></label><div class="list" id="issue-list">${issueList()}</div><hr class="rule">${btn('Create pull request','new-pr','wide','plus')}<div class="side-note">Showing sample open items.<br>GitHub operations are simulated.</div>`;
 $('#sidebar').innerHTML=sideShell('GitHub',content,'Sample connection · No API calls',btn('', 'refresh','quiet icon','refresh','aria-label="Refresh sample items" title="Refresh sample items"'));
 }else if(state.module==='addons'){
 content=`<div class="segmented" aria-label="Addon source">${['installed','catalog'].map(t=>`<button data-action="addon-tab" data-tab="${t}" aria-pressed="${state.addonTab===t}">${t==='installed'?'Installed':'Browse catalog'}</button>`).join('')}</div><div style="height:14px"></div><label class="field"><span>Find an addon</span><input type="search" id="addon-filter" placeholder="Search addons…" value="${esc(state.addonQuery)}"></label><div class="list" id="addon-list">${addonList()}</div><hr class="rule">${btn('Install local package…','local-package','wide','plus')}<div class="side-note">A shared visual language for every addon. Consistent controls, colors, and spacing.</div>`;
 $('#sidebar').innerHTML=sideShell('Addons',content,'Preview catalog · Local sample data');
 }else if(state.module==='explorer'){
 content=`<div class="eyebrow">NewCode</div>${treeFolder('src','src')}${state.folders.src?treeFile('ui_theme.rs'):''}${treeFolder('addons','addons')}${state.folders.addons?`<div class="tree-row tree-file muted">${icon('folder')}github / src</div>${treeFile('view.rs')}`:''}${treeFile('README.md')}<hr class="rule"><div class="side-note">Files are editable samples. Save marks them clean in this preview.</div>`;
 $('#sidebar').innerHTML=sideShell('Explorer',content,'3 sample files',btn('','new-file','quiet icon','plus','aria-label="New sample file" title="New sample file"'));
 }else if(state.module==='search'){
 content=`<label class="field"><span>Search workspace samples</span><input id="search-input" type="search" value="${esc(state.search)}" placeholder="Try “Widget” or “Theme”…"></label><label class="check"><input type="checkbox" id="match-case">Match case</label><hr class="rule"><div id="search-results">${searchResults()}</div>`;
 $('#sidebar').innerHTML=sideShell('Search',content,'Searches preview file content only');
 }else if(state.module==='git'){
 content=`<div class="meta-line">${icon('git')}<span class="mono">${esc(state.branch)}</span>${badge('3 changes','neutral')}</div><div class="eyebrow">Changes</div>${['view.rs','ui_theme.rs','README.md'].map(f=>`<label class="tree-row"><input type="checkbox" data-stage="${f}" ${state.gitFiles.has(f)?'checked':''}><span class="grow">${f}</span><span style="color:var(--warning)">M</span></label>`).join('')}<hr class="rule"><div class="side-note">Select files to stage them, then enter a commit message in the main panel.</div>`;
 $('#sidebar').innerHTML=sideShell('Source control',content,'Sample changes · No Git commands');
 }else if(state.module==='assistant'){
 content=`<label class="field"><span>Assistant</span><select id="assistant-select"><option ${state.assistant==='Codex'?'selected':''}>Codex</option><option ${state.assistant==='OpenCode'?'selected':''}>OpenCode</option></select></label><div class="eyebrow">Current conversation</div><button class="list-item" aria-current="true" data-action="current-chat">${icon('spark')}<span><strong>UI upgrade</strong><small>NewCode · This session</small></span></button><hr class="rule">${btn('New conversation','new-chat','wide','plus')}<div class="side-note">The composer and conversation use the same shared fields and action controls as other panels.</div>`;
 $('#sidebar').innerHTML=sideShell('Assistant',content,'Scripted responses · No model calls');
 }else{
 content=`<div class="eyebrow">Design foundations</div>${[['buttons','Actions & buttons'],['fields','Fields & forms'],['states','Feedback & states'],['tokens','Theme tokens']].map(([id,label])=>`<button class="list-item" data-action="component-section" data-section="${id}">${icon('palette')}<span><strong>${label}</strong></span></button>`).join('')}<hr class="rule"><div class="side-note">One set of graphical elements, reused in the editor and every addon.<br><br>All examples are live. Use Tab to inspect focus states.</div>`;
 $('#sidebar').innerHTML=sideShell('Component library',content,'Proposed shared UI primitives');
 }
}
function issueList(){const items=(state.githubTab==='issues'?issues:pulls).filter(i=>`${i.n} ${i.title}`.toLowerCase().includes(state.query.toLowerCase()));return items.length?items.map(i=>`<button class="list-item" aria-current="${state.item===i.n&&state.githubPage==='item'}" data-action="item" data-number="${i.n}">${icon(state.githubTab==='issues'?'issue':'pull')}<span class="grow"><strong>${esc(i.title)}</strong><small>#${i.n} · ${i.age}</small></span></button>`).join(''):`<div class="empty">${icon('search')}<h3>No matching items</h3><p>Try another title or issue number.</p>${btn('Clear filter','clear-filter','quiet')}</div>`}
function addonList(){const list=addons.filter(a=>(state.addonTab==='catalog'||a.installed)&&a.name.toLowerCase().includes(state.addonQuery.toLowerCase()));return list.length?list.map(a=>`<button class="list-item" aria-current="${state.addon===a.id}" data-action="addon" data-id="${a.id}"><span class="addon-mark">${a.mark}</span><span class="grow"><strong>${a.name}</strong><small>${a.installed?(a.enabled?'Enabled':'Disabled'):'Available to install'}</small></span></button>`).join(''):`<div class="empty"><h3>No addons found</h3><p>Try another search.</p>${btn('Clear search','clear-addon-filter','quiet')}</div>`}
function treeFolder(id,name){return `<button class="tree-row tree-folder" data-action="folder" data-id="${id}" aria-expanded="${state.folders[id]}"><span>${state.folders[id]?'⌄':'›'}</span>${icon('folder')}${name}</button>`}
function treeFile(name){return `<button class="tree-row tree-file" aria-current="${state.file===name}" data-action="file" data-file="${name}"><span class="file-type">${name.endsWith('.rs')?'Rs':'M'}</span>${name}${state.dirty.has(name)?'<span class="count">●</span>':''}</button>`}
function searchResults(){if(!state.search)return '<p class="side-note">Find text across the sample editor files.</p>';const caseSensitive=$('#match-case')?.checked;const query=caseSensitive?state.search:state.search.toLowerCase();const found=Object.entries(files).filter(([,text])=>(caseSensitive?text:text.toLowerCase()).includes(query));return found.length?found.map(([name,text])=>`<button class="list-item" data-action="file" data-file="${esc(name)}">${icon('file')}<span><strong>${esc(name)}</strong><small>${esc(text.split('\n').find(line=>(caseSensitive?line:line.toLowerCase()).includes(query))||'Match found')}</small></span></button>`).join(''):'<p class="side-note">No matching sample files.</p>'}
function mainBar(label,action=''){return `<div class="main-bar">${btn('','mobile-sidebar','quiet icon mobile-menu','addons','aria-label="Show module navigation"')}<span>NewCode</span><span>/</span><span>${label}</span>${action||btn('Back to editor','back-editor','quiet','back')}</div>`}
function renderMain(){
 if(state.module==='explorer'){renderEditor();return}
 let html='';let label=modules.find(m=>m[0]===state.module)[1];
 if(state.module==='github'){html=state.githubPage==='create'?prForm():githubDetail()}
 if(state.module==='addons'){html=addonDetail()}
 if(state.module==='components'){html=components()}
 if(state.module==='assistant'){html=assistantView()}
 if(state.module==='git'){html=gitView()}
 if(state.module==='search'){html=`<div class="page-heading"><div class="eyebrow">Workspace search</div><h1>Find your next change.</h1><p>Search the sample files in the sidebar. Select a result to open it in the editor.</p></div>${notice('On a narrow screen, use the navigation button above to open the search panel.')}`}
 $('#main').innerHTML=mainBar(label)+`<div class="main-scroll"><div class="content">${html}</div></div>`+terminalView();
 if(state.module==='github'&&state.githubPage==='item'){bindDraft('branch-name','issue-branch');bindDraft('base-branch','issue-base')}
 if(state.module==='github'&&state.githubPage==='create'){['pr-title','pr-body','pr-base'].forEach(id=>bindDraft(id,id))}
}
function githubDetail(){const pull=state.githubTab==='pulls';const item=(pull?pulls:issues).find(i=>i.n===state.item)||(pull?pulls:issues)[0];
 return `<div class="page-heading"><div class="row spread"><div class="eyebrow">${esc(state.repo)} / ${pull?'Pull requests':'Issues'}</div><a class="btn quiet" href="https://github.com/${encodeURIComponent(state.repo.split('/')[0])}/${encodeURIComponent(state.repo.split('/')[1])}/${pull?'pull':'issues'}/${item.n}" target="_blank" rel="noopener noreferrer">Open on GitHub ${icon('external')}</a></div><h1 style="margin-top:12px">${esc(item.title)} <span class="muted" style="font-weight:400">#${item.n}</span></h1><div class="row">${badge(pull?'Open pull request':'Open issue','success')}${badge(item.tag)}<span class="meta-line"><span class="avatar">NF</span>franchet-ovh opened ${item.age}</span></div></div>
 <article class="card"><div class="card-head"><h3>${pull?'Changes at a glance':'About this issue'}</h3><small>Sample content</small></div><div class="card-body prose">${item.n===75?`<p>Make Focus feel consistent, comfortable, and easy to extend.</p><ul><li>Use shared graphical elements across the editor and addons.</li><li>Improve GitHub navigation and addon management.</li><li>Make buttons and text areas easier to use.</li><li>Start in native UI mode and add help to both executables.</li></ul><p><strong>First step:</strong> validate an interactive HTML design before implementation.</p>`:pull?`<p>This sample pull request brings shared UI patterns into the editor.</p><p>Controls inherit their appearance from semantic theme tokens.</p><div class="row">${badge('+128 additions','success')}${badge('−42 deletions','error')}</div>`:`<p>A sample issue for reviewing navigation, text hierarchy, and actions.</p><p>Switch between items to see how the same layout adapts to different content.</p>`}</div></article>
 <div class="section-heading"><h2>${pull?'Review & merge':'Start working on this issue'}</h2>${badge('Local preview','neutral')}</div>
 ${pull?`<div class="card"><div class="card-body stack"><div class="meta-line mono">feature/shared-ui ${icon('arrow')} main</div>${notice('Checks passed in this sample. Merging here only changes the preview.','success')}<label class="check"><input type="checkbox" id="delete-branch">Delete branch after merge</label><div class="row">${btn('Squash & merge…','merge','primary','pull')}${btn('View sample changes','navigate','','file','data-module="git"')}</div></div></div>`:
 `<form id="branch-form" class="card"><div class="card-body"><div class="two-col">${field('Branch name','branch-name',state.form['issue-branch']||`issue-${item.n}`,'','required pattern="[A-Za-z0-9][A-Za-z0-9_./-]*" title="Use letters, digits, dots, slashes, underscores, or hyphens"')}${field('Base branch','base-branch',state.form['issue-base']||'main','','required')}</div><label class="check" style="margin-top:14px"><input type="checkbox" id="reuse-branch">Reuse branch if it already exists</label><div class="form-actions"><span class="meta-line">Creates a branch and checks it out.</span><button class="btn primary" type="submit">${icon('git')}Create issue branch</button></div></div></form><div class="row spread" style="margin-top:16px"><span class="meta-line">Want help with the implementation?</span>${btn('Open in assistant','issue-assistant','quiet','spark')}</div>`}`;
}
function prForm(){return `<div class="page-heading"><div class="eyebrow">GitHub / New pull request</div><h1>Share your changes.</h1><p>Give reviewers a clear title and a little context.</p></div><form id="pr-form" class="card"><div class="card-body stack">${notice(`Sample push from <strong>${esc(state.branch)}</strong> to ${esc(state.repo)}.`)}${field('Base branch','pr-base',state.form['pr-base']||'main','','required')}${field('Title','pr-title',state.form['pr-title']||'Improve shared UI controls','A short summary of your change','required maxlength="200"')}<label class="field"><span>Description</span><textarea id="pr-body" placeholder="What changed, and how did you check it?" required>${esc(state.form['pr-body']||'## What changed\nConsistent buttons, fields, and navigation across the editor.\n\n## Validation\nReviewed the interactive design preview.')}</textarea><small>Markdown is supported. This preview keeps your draft while you navigate.</small></label><label class="check"><input type="checkbox" id="draft-pr">Create as a draft</label><div class="form-actions">${btn('Cancel','cancel-pr','quiet')}<button class="btn primary" type="submit">${icon('pull')}Push & create pull request</button></div></div></form>`}
function addonDetail(){const a=addons.find(a=>a.id===state.addon)||addons[0];return `<div class="page-heading"><div class="eyebrow">Addons / ${state.addonTab==='installed'?'Installed':'Catalog'}</div><div class="addon-hero"><div class="addon-mark">${a.mark}</div><div><h1>${a.name}</h1><span class="meta-line">Focus Editor · ${a.version} ${badge('Bundled','neutral')}</span></div></div><p>${a.desc}</p></div><div class="card"><div class="card-head"><div class="row">${badge(a.installed?(a.enabled?'Enabled':'Disabled'):'Available',a.enabled?'success':'neutral')}<small>${a.installed?'Installed in this preview':'Compatible with this editor'}</small></div><div class="row">${a.installed?btn(a.enabled?'Disable':'Enable','toggle-addon',a.enabled?'':'primary','',`data-id="${a.id}"`):btn('Install addon','install-addon','primary','plus',`data-id="${a.id}"`)}</div></div><div class="card-body prose"><h3>Made for your workflow</h3><p>${a.id==='github'?'Browse issues and pull requests, start an issue branch, and prepare a pull request from your current work. A clearer list, a readable detail panel, and actions where you expect them.':a.desc}</p><p>Uses the same buttons, labeled fields, navigation, and feedback states as the rest of Focus.</p></div><div class="facts"><div><small>Publisher</small><strong>Focus Editor</strong></div><div><small>Version</small><strong>${a.version}</strong></div><div><small>Presentation</small><strong>Shared theme</strong></div></div></div><div class="section-heading"><h2>Quick actions</h2></div><div class="row">${a.id==='github'?btn('Open GitHub panel','navigate','','github','data-module="github"'):a.id==='codex'||a.id==='opencode'?btn('Open assistant','open-addon-assistant','','spark',`data-id="${a.id}"`):btn('Show language status','language-status','','check')}${a.installed?btn('Restart','restart-addon','','refresh',`data-id="${a.id}"`):''}${a.id==='github'?btn('Manage connection…','credentials','','',''):''}</div>${a.installed?`<hr class="rule"><div class="row spread"><div><h3>Remove addon</h3><small>In this preview, removal only updates sample state.</small></div>${btn('Uninstall…','uninstall-addon','danger','',`data-id="${a.id}"`)}</div>`:''}<div class="section-heading"><h2>More from Focus</h2>${btn('Browse all','browse-all','quiet','arrow')}</div><div class="card">${addons.filter(x=>x.id!==a.id).slice(0,2).map(x=>`<div class="addon-card"><span class="addon-mark">${x.mark}</span><div class="grow"><h3>${x.name}</h3><p>${x.desc}</p>${badge(x.installed?'Installed':'Available','neutral')}</div>${btn('Details','addon','','',`data-id="${x.id}"`)}</div>`).join('')}</div>`}
function renderEditor(){const lines=files[state.file].split('\n').map((_,i)=>i+1).join('\n');$('#main').innerHTML=`<div class="editor-tabs" role="tablist" aria-label="Sample files">${Object.keys(files).map(f=>`<button class="editor-tab" role="tab" aria-selected="${state.file===f}" data-action="file" data-file="${esc(f)}"><span class="file-type">${f.endsWith('.rs')?'Rs':'M'}</span>${esc(f)}${state.dirty.has(f)?' ●':''}</button>`).join('')}</div>${mainBar(`src / ${esc(state.file)}`,btn('Save','save','quiet','save'))}<div class="code-surface"><div class="line-numbers" aria-hidden="true">${lines}</div><textarea class="code-input" id="code-input" spellcheck="false" aria-label="Editable sample ${esc(state.file)}" wrap="off">${esc(files[state.file])}</textarea></div>${terminalView()}`}
function terminalView(){if(!state.terminal)return '';return `<section class="terminal" aria-label="Terminal and logs"><div class="terminal-bar">${['terminal','logs'].map(t=>`<button class="btn quiet" data-action="bottom-tab" data-tab="${t}" aria-pressed="${state.bottomTab===t}">${t==='terminal'?'Terminal':'Logs'}</button>`).join('')}<small>Preview output</small><span class="grow"></span>${btn('','close-terminal','quiet icon','close','aria-label="Close terminal panel"')}</div><div class="terminal-body">${state.bottomTab==='logs'?'<span class="muted">[preview] Shared controls loaded.<br>[preview] No external processes or services started.</span>':`<div><span class="terminal-prompt">❯</span> NewCode <span class="muted">cargo check</span></div><div class="muted">Sample output: finished dev profile in 1.82s</div><form id="terminal-form"><span class="terminal-prompt">❯</span> <input class="terminal-input" id="terminal-command" aria-label="Simulated terminal command" placeholder="Type a sample command and press Enter" autocomplete="off"></form>`}</div></section>`}
function assistantView(){return `<div class="page-heading"><div class="eyebrow">${state.assistant} / NewCode</div><h1>A second pair of eyes.</h1><p>Context stays close. Controls stay familiar.</p></div>${notice('This conversation is scripted to demonstrate the design. No requests are sent.')}<div class="conversation"><div class="message user"><small>You</small>Help me make the editor UI more consistent.</div><div class="message"><small>${state.assistant} · Sample response</small><p>I’d start with shared controls: one button family, labeled inputs, and a consistent panel header. GitHub and addon management can then use the same visual language.</p><div class="row" style="margin-top:12px">${badge('Shared theme')}${badge('Keyboard accessible','success')}</div></div>${state.messages.map(m=>`<div class="message ${m.role==='You'?'user':''}"><small>${esc(m.role)}</small>${esc(m.text)}</div>`).join('')}</div><form id="assistant-form" class="composer"><textarea id="assistant-draft" aria-label="Message to assistant" placeholder="Ask a follow-up or describe a change…" required>${esc(state.draft)}</textarea><div class="row"><label class="check"><select id="assistant-mode" aria-label="Assistant mode"><option>Plan</option><option>Code</option></select></label><span class="grow"></span><span class="meta-line">Sample conversation</span><button class="btn primary" type="submit">Send ${icon('arrow')}</button></div></form>`}
function gitView(){return `<div class="page-heading"><div class="eyebrow">Source control / ${esc(state.branch)}</div><h1>Changes, in context.</h1><p>Review sample changes and stage files from the sidebar.</p></div><div class="card"><div class="card-head"><h3>view.rs</h3><div class="row">${badge('+4','success')}${badge('−2','error')}</div></div><div class="card-body mono" style="font-size:12px;line-height:2;overflow:auto"><div style="color:var(--muted)">@@ repository_panel @@</div><div style="background:var(--error-soft);color:var(--error);white-space:pre">− ui.button("Refresh");</div><div style="background:var(--success-soft);color:var(--success);white-space:pre">+ shared::button(ui, "Refresh");<br>+ shared::field(ui, "Filter issues");</div></div></div><div class="section-heading"><h2>Create a commit</h2><span class="meta-line" id="staged-count">${state.gitFiles.size} files staged</span></div><form id="commit-form" class="card"><div class="card-body stack">${field('Commit message','commit-message',state.form.commit||'','Describe this change','required')}<div class="row spread"><span class="meta-line">Preview only · Your repository is untouched</span><button class="btn primary" id="commit-button" ${state.gitFiles.size?'':'disabled'} type="submit">${icon('check')}Commit staged files</button></div></div></form>`}
function components(){return `<div class="page-heading"><div class="eyebrow">Design system / v01</div><h1>Familiar, everywhere.</h1><p>A small set of predictable controls for every editor panel and addon.</p></div><div class="control-grid"><section class="sample" id="buttons"><h3>Actions & hierarchy</h3><div class="row">${btn('Primary action','sample-primary','primary','plus')}${btn('Secondary','sample-secondary')}${btn('Quiet action','sample-quiet','quiet')}</div><div class="row">${btn('Delete…','sample-delete','danger')}${btn('Unavailable','sample-disabled','','','disabled')}${btn('','sample-refresh','icon','refresh','aria-label="Refresh example" title="Refresh example"')}</div><small>34px controls · 6px corners · Visible focus</small></section><section class="sample" id="fields"><h3>Fields & forms</h3>${field('Project name','sample-name','','e.g. NewCode')}<label class="field"><span>Description</span><textarea id="sample-description" placeholder="Enough space to write comfortably…"></textarea><small>A persistent label and a useful hint.</small></label><label class="check"><input type="checkbox">Remember this choice</label></section><section class="sample"><h3>Choices & navigation</h3><div class="segmented" aria-label="Sample view choice"><button data-action="sample-tab" data-tab="first" aria-pressed="${state.sampleTab==='first'}">Overview</button><button data-action="sample-tab" data-tab="second" aria-pressed="${state.sampleTab==='second'}">Activity</button></div><p class="muted" id="sample-tab-content" style="font-size:12px">${state.sampleTab==='first'?'Overview selected. Navigation has a clear selected state.':'Activity selected. The same control works across modules.'}</p><label class="field"><span>Example selector</span><select id="sample-select"><option>Use workspace defaults</option><option>Custom configuration</option></select></label><div class="row">${badge('Connected','success')}${badge('Pending','warning')}${badge('Offline','error')}</div></section><section class="sample" id="states"><h3>Feedback & states</h3>${notice('Your changes are saved.','success')}${notice('A restart is needed to apply this change.','warning')}${notice('Could not load the sample catalog. Try again.','error')}<div class="row"><span class="spinner" aria-hidden="true"></span><span class="meta-line">Loading sample state</span></div></section><section class="sample"><h3>Empty state</h3><div class="empty">${icon('search')}<h3>Nothing here yet.</h3><p>Explain the state, then offer a useful next step.</p>${btn('Browse addons','navigate','','addons','data-module="addons"')}</div></section><section class="sample" id="tokens"><h3>Semantic theme tokens</h3><div class="swatches"><span class="swatch" style="background:var(--accent);color:var(--raised)">Accent</span><span class="swatch" style="background:var(--panel)">Panel</span><span class="swatch" style="background:var(--raised)">Raised</span></div><div class="swatches"><span class="swatch" style="background:var(--success-soft);color:var(--success)">Success</span><span class="swatch" style="background:var(--error-soft);color:var(--error)">Error</span></div><small>14px base · 12px controls · 8px spacing unit<br>Appearance changes apply to every module.</small>${btn('Switch appearance','theme','','palette')}</section></div>`}
function bindDraft(id,key){const el=document.getElementById(id);if(el)el.addEventListener('input',()=>state.form[key]=el.value)}
let dialogCallback=null;
function modal(title,body,confirm='Confirm',callback=()=>{},danger=false){const d=$('#dialog');dialogCallback=callback;d.innerHTML=`<form id="dialog-form"><div class="dialog-body"><h2 id="dialog-title">${title}</h2>${body}</div><div class="dialog-actions"><button type="button" class="btn quiet" data-action="cancel-dialog">Cancel</button><button type="submit" class="btn ${danger?'danger':'primary'}">${confirm}</button></div></form>`;d.showModal()}
const actions={
 navigate:b=>nav(b.dataset.module),
 theme:()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#theme-button').textContent=dark?'Light appearance':'Dark appearance'},
 'mobile-sidebar':()=>$('#workspace').classList.toggle('sidebar-open'),
 'github-tab':b=>{state.githubTab=b.dataset.tab;state.item=(state.githubTab==='issues'?issues:pulls)[0].n;state.githubPage='item';render()},
 item:b=>{state.item=Number(b.dataset.number);state.githubPage='item';$('#workspace').classList.remove('sidebar-open');render()},
 'clear-filter':()=>{state.query='';renderSidebar()},
 refresh:()=>{if(refreshBusy)return;refreshBusy=true;toast('Refreshing sample items…');clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{refreshBusy=false;toast('Sample items are up to date. No network request sent.')},650)},
 'new-pr':()=>{state.githubPage='create';$('#workspace').classList.remove('sidebar-open');render()},
 'cancel-pr':()=>{state.githubPage='item';render()},
 'issue-assistant':()=>{state.draft=`Help me work on issue #${state.item}: ${(issues.find(i=>i.n===state.item)||issues[0]).title}`;nav('assistant')},
 merge:()=>modal('Merge this sample pull request?',`<p>This demonstrates a destructive-action confirmation. No pull request will be changed on GitHub.</p>`,'Simulate merge',()=>toast('Sample merge complete. GitHub was not changed.')),
 'addon-tab':b=>{state.addonTab=b.dataset.tab;render()},
 addon:b=>{state.addon=b.dataset.id;$('#workspace').classList.remove('sidebar-open');render()},
 'toggle-addon':b=>{const a=addons.find(a=>a.id===b.dataset.id);a.enabled=!a.enabled;render();toast(`${a.name} ${a.enabled?'enabled':'disabled'} in this preview.`)},
 'install-addon':b=>{const a=addons.find(a=>a.id===b.dataset.id);b.disabled=true;b.textContent='Installing sample…';setTimeout(()=>{a.installed=true;a.enabled=true;if(state.module==='addons')render();toast(`${a.name} installed in sample state only.`)},600)},
 'uninstall-addon':b=>{const a=addons.find(a=>a.id===b.dataset.id);modal(`Uninstall ${a.name}?`,`<p>Remove this addon from the sample installed list? No installed files will be affected.</p>`,'Uninstall sample',()=>{a.installed=false;a.enabled=false;render();toast('Addon removed from sample state.')},true)},
 'restart-addon':b=>toast(`${addons.find(a=>a.id===b.dataset.id).name} restarted in this preview.`),
 'browse-all':()=>{state.addonTab='catalog';state.addonQuery='';render();$('#workspace').classList.add('sidebar-open')},
 'clear-addon-filter':()=>{state.addonQuery='';renderSidebar()},
 'local-package':()=>modal('Install a local addon',`<p>Preview the installation form. No package will be read or executed.</p>${field('Package path','package-path','','/path/to/addon.tar.gz','required')}`,'Simulate installation',()=>toast('Local package installation simulated. No files were accessed.')),
 credentials:()=>modal('GitHub connection',`<p>This is a design sample. Do not enter a real token.</p>${notice('Use a dummy value to try the connection form.')}<div style="height:16px"></div>${field('Sample access token','sample-token','','demo-token','required type="password" autocomplete="off"')}<small>Real credentials will continue to use the existing secure storage.</small>`,'Simulate connection',()=>toast('Sample connection saved in this preview only.')),
 'open-addon-assistant':b=>{state.assistant=b.dataset.id==='codex'?'Codex':'OpenCode';nav('assistant')},
 'language-status':()=>toast('Sample language service ready. No server was started.'),
 file:b=>{state.file=b.dataset.file;nav('explorer')},
 folder:b=>{state.folders[b.dataset.id]=!state.folders[b.dataset.id];renderSidebar()},
 'new-file':()=>modal('New sample file',`<p>Add a file to the in-memory preview. It will disappear when the page reloads.</p>${field('File name','new-filename','','notes.md','required pattern="[A-Za-z0-9_.-]+"')}`,'Create sample',()=>{const name=$('#new-filename').value;if(Object.hasOwn(files,name)){toast('A sample file with that name already exists.');return}files[name]='';state.file=name;nav('explorer')}),
 save:()=>{state.dirty.delete(state.file);if(state.module==='explorer')render();toast('Sample marked saved. No disk files were written.')},
 'back-editor':()=>nav('explorer'),
 terminal:()=>{state.terminal=!state.terminal;renderMain()},
 'close-terminal':()=>{state.terminal=false;renderMain()},
 'bottom-tab':b=>{state.bottomTab=b.dataset.tab;renderMain()},
 'current-chat':()=>{state.module='assistant';$('#workspace').classList.remove('sidebar-open');renderMain()},
 'new-chat':()=>{state.messages=[];state.draft='';renderMain();toast('New sample conversation started.')},
 'component-section':b=>{$('#workspace').classList.remove('sidebar-open');document.getElementById(b.dataset.section)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})},
 'sample-tab':b=>{state.sampleTab=b.dataset.tab;document.querySelectorAll('[data-action=sample-tab]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#sample-tab-content').textContent=state.sampleTab==='first'?'Overview selected. Navigation has a clear selected state.':'Activity selected. The same control works across modules.'},
 'sample-primary':()=>toast('Primary action activated.'),'sample-secondary':()=>toast('Secondary action activated.'),'sample-quiet':()=>toast('Quiet action activated.'),'sample-refresh':()=>toast('Example refreshed.'),
 'sample-delete':()=>modal('Delete the sample item?','<p>This confirmation uses the same dialog and button styles as the rest of the editor.</p>','Delete sample',()=>toast('Sample deletion confirmed.'),true),
 workspace:()=>modal('Workspace',`<p>The preview uses the NewCode sample workspace. Production workspaces are not accessed.</p>${field('Sample workspace name','workspace-name','NewCode','','required')}`,'Apply sample name',()=>{document.querySelector('.workspace-label').textContent=$('#workspace-name').value;toast('Preview workspace label updated.')}),
 'cancel-dialog':()=>$('#dialog').close()
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)actions[b.dataset.action]?.(b)});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='issue-filter'){state.query=el.value;$('#issue-list').innerHTML=issueList()}if(el.id==='addon-filter'){state.addonQuery=el.value;$('#addon-list').innerHTML=addonList()}if(el.id==='assistant-draft')state.draft=el.value;if(el.id==='commit-message')state.form.commit=el.value;if(el.id==='search-input'){state.search=el.value;$('#search-results').innerHTML=searchResults()}if(el.id==='code-input'){files[state.file]=el.value;state.dirty.add(state.file);$('.line-numbers').textContent=el.value.split('\n').map((_,i)=>i+1).join('\n');document.querySelectorAll('.editor-tab').forEach(t=>{if(t.dataset.file===state.file&&!t.textContent.endsWith(' ●'))t.append(' ●')})}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='repository'){state.repo=el.value;state.query='';state.form={};render()}if(el.id==='assistant-select'){state.assistant=el.value;renderMain()}if(el.id==='match-case')$('#search-results').innerHTML=searchResults();if(el.dataset.stage){el.checked?state.gitFiles.add(el.dataset.stage):state.gitFiles.delete(el.dataset.stage);$('#staged-count').textContent=`${state.gitFiles.size} files staged`;$('#commit-button').disabled=!state.gitFiles.size}});
document.addEventListener('submit',e=>{e.preventDefault();switch(e.target.id){
 case 'branch-form':{const branch=$('#branch-name').value.trim();if(!branch){$('#branch-name').setCustomValidity('Enter a branch name.');$('#branch-name').reportValidity();$('#branch-name').setCustomValidity('');return}state.branch=branch;render();toast(`Checked out ${branch} in this preview only.`);break}
 case 'pr-form':{const draft=$('#draft-pr').checked;modal(draft?'Create this sample draft?':'Create this sample pull request?',`<p><strong>${esc($('#pr-title').value)}</strong></p><p>The push and pull request are simulated. Your repository and GitHub account will not change.</p>`,'Simulate creation',()=>{state.githubPage='item';state.githubTab='pulls';state.item=74;render();toast(`Sample ${draft?'draft':'pull request'} created. No changes sent to GitHub.`)});break}
 case 'assistant-form':state.messages.push({role:'You',text:state.draft},{role:state.assistant+' · Sample response',text:'This is a scripted reply. The proposed shared controls keep actions clear and give text areas enough room. You can review these same patterns in GitHub, Addons, and the component library.'});state.draft='';renderMain();$('.main-scroll').scrollTop=$('.main-scroll').scrollHeight;break;
 case 'commit-form':if(state.gitFiles.size){state.gitFiles.clear();state.form.commit='';render();toast('Sample commit complete. Your repository was not modified.')}break;
 case 'terminal-form':toast(`Simulated command: ${$('#terminal-command').value||'(empty)'}. Nothing executed.`);$('#terminal-command').value='';break;
 case 'dialog-form':{const callback=dialogCallback;callback?.();$('#dialog').close();break}
 }});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&state.module==='explorer'&&!$('#dialog').open){e.preventDefault();actions.save()}if(e.key==='Escape')$('#workspace').classList.remove('sidebar-open')});
$('#brand-icon').innerHTML=icon('spark');
render();
</script>
</body>
</html>
