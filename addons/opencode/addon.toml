execution = "workspace"
id = "opencode"
name = "OpenCode"
version = "0.6.1"
editor_version_req = ">=0.6.1, <0.7.0"
protocol = 1
executable = "focus-addon-opencode"
icon = "icon.png"
panel = "right"
ui = "surface"
enabled_by_default = false
environment = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL", "OPENAI_API_KEY", "OPENAI_BASE_URL", "GEMINI_API_KEY", "GOOGLE_API_KEY", "OPENCODE_API_KEY", "OPENCODE_SERVER_PASSWORD", "OPENCODE_SERVER_USERNAME", "XDG_DATA_HOME"]

[[settings]]
key = "binary_path"
label = "OpenCode binary"
placeholder = "opencode"
description = "Executable path or command name. Leave blank to find opencode on PATH. Relative paths use the workspace folder. Use a container path when running in a Dev Container. Shell variables and ~ are not expanded."
